<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Heist — GTA-style Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Golden Heist</h1>
    <p class="tag">Your photos, made into a GTA-style poster cover. Everything stays on your machine.</p>

    <label>Title <input id="title" type="text" maxlength="24" value="GOLDEN HEIST"></label>
    <label>Script subtitle <input id="subtitle" type="text" maxlength="40" value="steal the sunset"></label>
    <label>Quote <input id="quote" type="text" maxlength="60" value="THE GOLDEN HOUR NEVER LOOKED THIS GOOD"></label>
    <label>Quote source <input id="gazette" type="text" maxlength="30" value="THE SUNSET LEDGER"></label>
    <label>Tagline <input id="tagline" type="text" maxlength="48" value="SIX CREW · ONE SCORE · NO WAY OUT"></label>

    <div class="row">
      <label>Layout <select id="layout"></select></label>
      <label>Grade <select id="grade"></select></label>
    </div>
    <label>Export size <select id="size"></select></label>

    <h2 id="panelName">Panel 1 — THE DRIVER</h2>
    <div id="panels" class="panel-pick">
      <button type="button" data-panel="0">1</button>
      <button type="button" data-panel="1">2</button>
      <button type="button" data-panel="2">3</button>
      <button type="button" data-panel="3">4</button>
      <button type="button" data-panel="4">5</button>
      <button type="button" data-panel="5">6</button>
    </div>
    <p class="hint">Click a panel on the cover, or a number here, to edit it.</p>
    <label>Photo <select id="panelPhoto"></select></label>
    <input id="uploadFile" type="file" accept="image/*" hidden>
    <label>Zoom <input id="panelZoom" type="range" min="0.8" max="3" step="0.05" value="1"></label>
    <label>Focus left–right <input id="panelFx" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label>Focus top–bottom <input id="panelFy" type="range" min="0" max="1" step="0.01" value="0.3"></label>
    <label>Role tag <input id="panelRole" type="text" maxlength="16" value="THE DRIVER"></label>

    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview">
    <canvas id="cover" width="980" height="551" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
