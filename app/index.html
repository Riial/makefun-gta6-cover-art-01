<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Coast Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">VICE COAST <span>Cover Studio</span></div>
  <p class="tagline">Your photos. Your caption. A poster in three clicks.</p>
</header>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <div class="group">
      <h2>1 · Photos</h2>
      <div id="photo-slots"></div>
      <button id="load-samples" type="button">Load the two sample photos</button>
      <p class="hint">Photos stay on your machine — nothing is uploaded.</p>
    </div>

    <div class="group">
      <h2>2 · Layout</h2>
      <div id="layout-presets" class="presets"></div>
    </div>

    <div class="group">
      <h2>3 · Colour grade</h2>
      <div id="grade-presets" class="presets"></div>
    </div>

    <div class="group">
      <h2>4 · Caption</h2>
      <label>Title
        <input id="title" type="text" maxlength="30" value="VICE COAST">
      </label>
      <label>Subtitle
        <input id="subtitle" type="text" maxlength="40" value="Sunset Heist">
      </label>
      <label>Title size
        <input id="title-size" type="range" min="0.7" max="1.4" step="0.05" value="1">
      </label>
      <div class="row">
        <label>Title colour
          <input id="title-color" type="color" value="#ffffff">
        </label>
        <label class="check">Dark outline
          <input id="title-outline" type="checkbox" checked>
        </label>
      </div>
    </div>

    <div class="group" id="panel-controls" aria-label="Selected panel controls"></div>

    <div class="group">
      <h2>5 · Export PNG</h2>
      <div id="exports" class="exports"></div>
      <p id="status" role="status"></p>
    </div>
  </section>

  <section class="preview" aria-label="Live preview">
    <div class="aspect-switch" role="group" aria-label="Preview size">
      <button type="button" data-aspect="landscape" class="active">Landscape</button>
      <button type="button" data-aspect="square">Square</button>
      <button type="button" data-aspect="portrait">Portrait</button>
    </div>
    <canvas id="cover" width="960" height="540" aria-label="Live cover preview"></canvas>
    <p class="hint">Click a panel to select it, then drag its photo to pan. Zoom with the slider.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
