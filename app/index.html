<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>VICE CITY <span>COVER STUDIO</span></h1>
    <p class="sub">Your photos, made into GTA-style poster covers. Everything stays on your machine.</p>
    <label>Title <input id="title" type="text" maxlength="24" value="VICE CITY"></label>
    <label>Script subtitle <input id="script" type="text" maxlength="40" value="Jason &amp; Lucia"></label>
    <label>Quote <input id="quote" type="text" maxlength="80" value="EVERY SUNSET ENDS IN A GETAWAY"></label>
    <label>Quote source <input id="quoteSource" type="text" maxlength="40" value="THE VICE GAZETTE"></label>
    <label>Tagline <input id="tagline" type="text" maxlength="60" value="TWO OUTLAWS · ONE COAST · NO WAY BACK"></label>
    <div class="row">
      <label>Layout <select id="layout"></select></label>
      <label>Grade <select id="grade"></select></label>
    </div>
    <label>Export size <select id="size"></select></label>
    <label>Upload a photo <input id="upload" type="file" accept="image/*"></label>
    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
    <h2 id="panelTitle">PANEL 1 — THE DRIVER</h2>
    <div class="panels" id="panelButtons"></div>
    <label>Panel photo <select id="panelPhoto"></select></label>
    <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
    <div class="row">
      <label>Focus X <input id="fx" type="range" min="0" max="1" step="0.05" value="0.5"></label>
      <label>Focus Y <input id="fy" type="range" min="0" max="1" step="0.05" value="0.35"></label>
    </div>
    <label>Role tag <input id="role" type="text" maxlength="16" value="THE DRIVER"></label>
    <p class="hint">Pick a panel number to edit it. Upload a photo to use it in the selected panel.</p>
  </section>
  <section class="preview">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
